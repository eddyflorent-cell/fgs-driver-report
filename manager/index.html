<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#ffffff" />
<link rel="apple-touch-icon" href="./icon-192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FGS Driver Manager</title>

<style>
  :root{
    /* Palette */
    --bg:#ffffff;
    --bg2:#f6f7fb;
    --card:#ffffff;
    --text:#101828;
    --muted:#667085;
    --line:#d0d5dd;

    --orange:#ec4f21;
    --orange2:#f49a1e;
    --green:#9ece09;

    --radius:18px;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    color:var(--text);
    background:linear-gradient(180deg,var(--bg),var(--bg2));
  }

  .wrap{ max-width:1100px; margin:0 auto; padding:16px; }

  /* Topbar */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 14px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:rgba(255,255,255,.92);
    backdrop-filter: blur(8px);
    position:sticky;
    top:12px;
    z-index:10;
    box-shadow:0 12px 30px rgba(16,24,40,.08);
  }

  .brand{ display:flex; align-items:center; gap:10px; }
  .logo{
    width:36px; height:36px;
    border-radius:12px;
    display:grid; place-items:center;
    color:#fff; font-weight:900;
    background:linear-gradient(135deg,var(--orange),var(--orange2));
    box-shadow:0 10px 24px rgba(236,79,33,.25);
  }
  .brand h1{ margin:0; font-size:14px; line-height:1.2; }
  .brand .sub{ font-size:12px; color:var(--muted); }

  .actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:flex-end; }

  /* Buttons */
  button, .btn{
    appearance:none;
    border:1px solid var(--line);
    background:#fff;
    color:var(--text);
    border-radius:14px;
    padding:10px 12px;
    cursor:pointer;
    font-weight:800;
    transition:transform .05s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
  }
  button:active, .btn:active{ transform:translateY(1px); }

  button.primary, .btn.primary{
    border-color:rgba(236,79,33,.45);
    background:rgba(236,79,33,.10);
  }
  button.primary:hover, .btn.primary:hover{
    background:rgba(236,79,33,.14);
    box-shadow:0 10px 20px rgba(236,79,33,.12);
  }

  button.ok, .btn.ok{
    border-color:rgba(158,206,9,.45);
    background:rgba(158,206,9,.12);
  }
  button.ok:hover, .btn.ok:hover{
    background:rgba(158,206,9,.16);
    box-shadow:0 10px 20px rgba(158,206,9,.12);
  }

  button.danger, .btn.danger{
    border-color:rgba(236,79,33,.55);
    background:rgba(236,79,33,.14);
    color:var(--text);
  }

  button:disabled, .btn:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
  }

  button:focus, .btn:focus,
  input:focus, select:focus, textarea:focus{
    outline:3px solid rgba(236,79,33,.25);
    outline-offset:2px;
  }

  /* Layout */
  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
    margin-top:12px;
  }
  @media (min-width:950px){
    .grid{ grid-template-columns:1fr 1fr; }
  }

  .card{
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:rgba(255,255,255,.96);
    padding:14px;
    box-shadow:0 12px 30px rgba(16,24,40,.06);
  }

  h2{ margin:0 0 8px 0; font-size:16px; }
  h3{ margin:12px 0 6px 0; font-size:14px; }
  .muted{ color:var(--muted); font-size:12px; margin:0; }

  /* Forms */
  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin:10px 0 6px;
  }
  input, select, textarea{
    width:100%;
    border:1px solid var(--line);
    background:#fff;
    color:var(--text);
    border-radius:14px;
    padding:11px 12px;
    font:inherit;
  }
  textarea{ min-height:92px; resize:vertical; }

  /* Pills / badges */
  .pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#f2f4f7;
    font-size:12px;
    color:var(--muted);
  }
  .pill b{ color:var(--text); }

  .badge{
    display:inline-block;
    padding:3px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:900;
    border:1px solid var(--line);
    background:#fff;
  }
  .b-in{ border-color:rgba(158,206,9,.40); background:rgba(158,206,9,.12); }
  .b-out{ border-color:rgba(16,185,129,.35); background:rgba(16,185,129,.10); }
  .b-incident{ border-color:rgba(236,79,33,.40); background:rgba(236,79,33,.12); }

  /* Lists */
  .list{ display:grid; gap:10px; margin-top:10px; }

  .item{
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px;
    background:#fff;
  }
  .meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    color:var(--muted);
    font-size:12px;
  }

  .thumbs{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .thumbs img{
    width:86px; height:86px;
    object-fit:cover;
    border-radius:14px;
    border:1px solid var(--line);
    background:#fff;
  }

  /* Tabs (si présents) */
  .tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .tab{
    padding:10px 12px;
    border-radius:14px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--muted);
    cursor:pointer;
    font-weight:900;
  }
  .tab.active{
    color:var(--text);
    border-color:rgba(236,79,33,.55);
    background:rgba(236,79,33,.10);
  }

  /* Helpers */
  .divider{ height:1px; background:var(--line); margin:12px 0; }
  .hide{ display:none !important; }

  /* Toast */
  .toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    background:#fff;
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 12px;
    border-radius:16px;
    max-width:92vw;
    z-index:99;
    box-shadow:0 14px 30px rgba(16,24,40,.14);
    display:none;
  }
  .toast.show{ display:block; }
</style>

</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo">FGS</div>
        <div>
          <h1>FGS Driver Manager</h1>
          <div class="sub">Importer • Archiver • Contrôler (offline)</div>
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="btnInstall">Installer</button>
        <button class="primary" id="btnImport">Importer un report</button>
        <button id="btnExportArchive">Exporter archive (JSON)</button>
      <button class="btn primary" id="btnShareArchive">Partager archive (Mail/Drive)</button>
        <button class="danger" id="btnWipe">Tout effacer</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Import</h2>
        <p class="muted">Wendy reçoit un fichier JSON via WhatsApp → elle le télécharge → puis l’importe ici.</p>
        <label>Fichier report (.json)</label>
        <input id="fileInput" type="file" accept="application/json,.json" />

        <div class="divider"></div>

        <h2>Filtres</h2>
        <label>Date</label>
        <input id="fDate" type="date" />
        <label>Chauffeur (contient)</label>
        <input id="fDriver" type="text" placeholder="ex: Jean" />
        <label>Type</label>
        <select id="fType">
          <option value="">Tous</option>
          <option value="checkin">Check-in</option>
          <option value="checkout">Check-out</option>
          <option value="incident">Incident</option>
        </select>

        <div class="divider"></div>

        <div class="kpi">
          <div class="box"><div class="k">Reports archivés</div><div class="v" id="kpiReports">0</div></div>
          <div class="box"><div class="k">Événements</div><div class="v" id="kpiEvents">0</div></div>
          <div class="box"><div class="k">Dernier import</div><div class="v" id="kpiLast">—</div></div>
        </div>
      </div>

      <div class="card">
        <h2>Archive</h2>
        <p class="muted">Chaque import garde : réglages chauffeur + événements + photos.</p>
        <div class="list" id="list"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (id)=>document.getElementById(id);
    const KEY = "fgs_manager_archive_v1"; // stores array of packs
    const toastEl = $("toast");

    function toast(msg){
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(()=>toastEl.classList.remove("show"), 2200);
    }
    function loadArchive(){
      try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { return []; }
    }
    function saveArchive(arr){
      localStorage.setItem(KEY, JSON.stringify(arr));
    }
    function escapeHtml(s){
      return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }
    function badge(type){
      if(type==="checkin") return `<span class="badge b-in">CHECK-IN</span>`;
      if(type==="checkout") return `<span class="badge b-out">CHECK-OUT</span>`;
      return `<span class="badge b-incident">INCIDENT</span>`;
    }

    function computeKpis(){
      const packs = loadArchive();
      const events = packs.reduce((n,p)=>n+(p.records?.length||0),0);
      $("kpiReports").textContent = packs.length;
      $("kpiEvents").textContent = events;
      const last = packs[0]?.importedAt ? new Date(packs[0].importedAt).toLocaleString() : "—";
      $("kpiLast").textContent = last;
    }

    function applyFilters(packs){
      const d = $("fDate").value;
      const drv = $("fDriver").value.trim().toLowerCase();
      const t = $("fType").value;

      // flatten events with pack context
      const rows = [];
      for(const p of packs){
        const settings = p.settings || {};
        const recs = p.records || [];
        for(const r of recs){
          rows.push({ pack:p, settings, r });
        }
      }

      return rows.filter(x=>{
        if(d && x.r.date !== d) return false;
        if(t && x.r.type !== t) return false;
        if(drv){
          const name = (x.r.driver || x.settings.driver || "").toLowerCase();
          if(!name.includes(drv)) return false;
        }
        return true;
      });
    }

    function render(){
      const packs = loadArchive();
      computeKpis();
      const list = $("list");
      list.innerHTML = "";

      const rows = applyFilters(packs);
      if(rows.length === 0){
        list.innerHTML = `<div class="item"><div class="muted">Aucun élément.</div></div>`;
        return;
      }

      for(const x of rows.slice(0, 120)){ // limit UI
        const r = x.r;
        const s = x.settings || {};
        const veh = [r.vehicle||s.vehicle, r.plate||s.plate].filter(Boolean).join(" • ");
        const title = `${badge(r.type)} <span class="pill" style="margin-left:8px;">${r.date} • ${r.time}</span>`;
        const kmLine = r.type==="incident" ? "" : `<div class="meta"><span>KM: <b>${r.km}</b></span> <span>Carburant: <b>${r.fuel}</b></span></div>`;
        const fixedLine = r.type==="checkout"
          ? `<div class="meta"><span>Fixe dû: <b>${r.fixedDue}</b></span> <span>Versé: <b>${r.fixedPaid}</b></span> <span>${r.payMode||""}</span></div>`
          : "";
        const note = r.type==="incident"
          ? `<div class="muted" style="margin-top:6px;white-space:pre-wrap;">${escapeHtml(r.desc)}</div>`
          : (r.note ? `<div class="muted" style="margin-top:6px;white-space:pre-wrap;">${escapeHtml(r.note)}</div>` : "");

        const thumbs = [];
        if(r.photos?.odometer) thumbs.push(r.photos.odometer);
        if(r.photos?.fuel) thumbs.push(r.photos.fuel);
        if(r.photos?.proof) thumbs.push(r.photos.proof);
        if(r.photos?.photo) thumbs.push(r.photos.photo);
        const imgs = thumbs.length ? `<div class="thumbs">${thumbs.map(src=>`<img src="${src}" alt="photo">`).join("")}</div>` : "";

        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `
          <div class="meta">${title}</div>
          <div class="meta" style="margin-top:6px;">
            <span>Chauffeur: <b>${escapeHtml(r.driver||s.driver||"—")}</b></span>
            <span>Véhicule: <b>${escapeHtml(veh||"—")}</b></span>
          </div>
          ${kmLine}
          ${fixedLine}
          ${note}
          ${imgs}
        `;
        list.appendChild(item);
      }
    }

    async function importPackFromFile(file){
      const text = await file.text();
      let pack;
      try { pack = JSON.parse(text); } catch { toast("JSON invalide"); return; }
      if(!pack || !Array.isArray(pack.records)){ toast("Format report non reconnu"); return; }

      // Normalize + stamp
      pack.importedAt = new Date().toISOString();
      pack.sourceFilename = file.name || "report.json";

      const archive = loadArchive();
      archive.unshift(pack);
      saveArchive(archive);

      toast("Report importé");
      render();
    }

    $("fileInput").addEventListener("change", async (e)=>{
      const f = e.target.files?.[0];
      if(!f) return;
      await importPackFromFile(f);
      $("fileInput").value = "";
    });

    $("btnImport").addEventListener("click", ()=> $("fileInput").click());

    $("btnExportArchive").addEventListener("click", ()=>{
      const archive = loadArchive();
      const blob = new Blob([JSON.stringify({ exportedAt:new Date().toISOString(), archive }, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `FGS-Manager-Archive-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 400);
      toast("Archive exportée");
    });

    $("btnWipe").addEventListener("click", ()=>{
      if(!confirm("Tout effacer (archive) ?")) return;
      localStorage.removeItem(KEY);
      toast("Archive effacée");
      render();
    });

    ["fDate","fDriver","fType"].forEach(id=>{
      $(id).addEventListener("input", render);
      $(id).addEventListener("change", render);
    });
// Service worker
    if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}

// --- PWA Install (Android Chrome) + fallback iPhone ---
let deferredPrompt = null;

function isStandalone() {
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}

function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}

function setInstallBtnState() {
  const btn = document.getElementById("btnInstall");
  if (!btn) return;

  if (isStandalone()) {
    btn.disabled = true;
    btn.textContent = "Installée";
    return;
  }

  // iOS: pas de beforeinstallprompt
  if (isIOS()) {
    btn.disabled = false;
    btn.textContent = "Installer (iPhone)";
    return;
  }

  // Android: activé seulement si beforeinstallprompt a été reçu
  btn.disabled = !deferredPrompt;
  btn.textContent = deferredPrompt ? "Installer" : "Installer (menu ⋮)";
}

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  setInstallBtnState();
});

document.getElementById("btnInstall")?.addEventListener("click", async () => {
  // iPhone: expliquer le geste
  if (isIOS()) {
    alert("Sur iPhone : Safari → Partager → Ajouter à l’écran d’accueil.");
    return;
  }

  // Android: si pas de prompt, expliquer au lieu de rien faire
  if (!deferredPrompt) {
    alert("Pas installable pour l’instant.\nEssaye : menu ⋮ de Chrome → « Installer l’application ».\nSi absent : vérifie manifest + icônes + SW, et ouvre dans Chrome (pas WhatsApp).");
    return;
  }

  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  setInstallBtnState();
});

// au chargement
setInstallBtnState();
window.addEventListener("appinstalled", () => {
  deferredPrompt = null;
  setInstallBtnState();
});

  
// --- Partage (Mail / Drive / WhatsApp) ---
async function shareFile(blob, filename, title, text){
  try{
    if(!("share" in navigator)) return false;
    const file = new File([blob], filename, { type: blob.type || "application/octet-stream" });
    if(navigator.canShare && !navigator.canShare({ files: [file] })) return false;
    await navigator.share({ title: title || filename, text: text || "", files: [file] });
    return true;
  }catch(e){
    return false;
  }
}


document.getElementById("btnShareArchive").addEventListener("click", async () => {
  try{
    // Reprend la même archive que "Exporter archive"
    const archive = loadArchive ? loadArchive() : (JSON.parse(localStorage.getItem("fgs_manager_archive")||"[]"));
    const payload = { exportedAt: new Date().toISOString(), archive };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const filename = `FGS-Manager-Archive-${new Date().toISOString().slice(0,10)}.json`;

    // Mobile: menu de partage -> Drive / Gmail / WhatsApp
    const ok = await shareFile(blob, filename, "FGS Driver Manager", "Archive FGS (JSON) — sauvegarde Drive ou envoi mail.");
    if(ok){
      toast && toast("Partage ouvert (Drive/Mail/WhatsApp)");
      return;
    }

    // PC: fallback téléchargement (puis tu joins au mail / Drive)
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 400);
    toast && toast("Téléchargé. Ensuite : ajoute sur Drive ou envoie par mail.");
  }catch(err){
    alert("Impossible de partager l’archive. Essaie Exporter archive (JSON) puis envoie le fichier.");
  }
});

</script>
</body>
</html>
